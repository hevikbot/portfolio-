<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HEVIK — Digital Engineering at the Edge</title>
<meta name="description" content="HEVIK — premium digital product engineering. Websites, apps, 3D and AI. Inspired by TON 618." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --bg: #000000;
  --fg: #e2e8f0;
  --silver: #cbd5e1;
  --ice: #7dd3fc;
  --glow: #38bdf8;
  --ember: #ff9a4d;
  --panel: rgba(6, 10, 18, 0.72);
  --border: rgba(125, 211, 252, 0.16);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: #000;
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.no-scroll { overflow: hidden; }
::selection { background: rgba(125, 211, 252, 0.35); color: #fff; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: linear-gradient(#1e293b, #0ea5e9); border-radius: 10px; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

/* ---------- Preloader ---------- */
#preloader {
  position: fixed; inset: 0; z-index: 1000;
  background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.9s var(--ease), visibility 0.9s var(--ease);
}
#preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.pl-ring { position: relative; width: 140px; height: 140px; }
.pl-ring .spin {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0%, rgba(255,154,77,0.95) 30%, rgba(56,189,248,0.95) 60%, transparent 100%);
  animation: spin 2.2s linear infinite;
  filter: blur(0.4px);
}
.pl-ring .inner {
  position: absolute; inset: 12px; border-radius: 50%; background: #000;
  box-shadow: inset 0 0 30px rgba(56,189,248,0.15);
}
.pl-ring .label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 10px; letter-spacing: 0.35em; color: rgba(226, 232, 240, 0.85);
  font-family: 'JetBrains Mono', monospace;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pl-bar-wrap { margin-top: 34px; width: 220px; }
.pl-bar { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.pl-bar > div {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--ember), var(--ice), var(--glow));
  transition: width 0.15s linear;
}
.pl-text {
  margin-top: 12px; text-align: center;
  font-size: 10px; letter-spacing: 0.3em; color: rgba(203, 213, 225, 0.6);
  font-family: 'JetBrains Mono', monospace;
}

/* ---------- Navbar ---------- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  transform: translateY(-20px); opacity: 0;
  transition: transform 0.9s var(--ease), opacity 0.9s var(--ease);
}
header.revealed { transform: translateY(0); opacity: 1; }
.nav-inner {
  margin: 12px auto; max-width: 1280px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  margin-left: 16px; margin-right: 16px;
}
@media (min-width: 1344px) {
  .nav-inner { margin-left: auto; margin-right: auto; }
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .dot-wrap { position: relative; width: 12px; height: 12px; display: inline-flex; }
.brand .dot-ping {
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(255, 154, 77, 0.55);
  animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}
.brand .dot-core {
  position: relative; width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffd3a8, #ff7a2e 40%, #7a1f00 100%);
  box-shadow: 0 0 12px rgba(255, 154, 77, 0.7);
}
@keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
.brand .name {
  font-size: 13px; font-weight: 600; letter-spacing: 0.32em; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
}
nav.links { display: none; gap: 32px; }
@media (min-width: 900px) { nav.links { display: flex; } }
nav.links a {
  font-size: 11px; letter-spacing: 0.22em; color: rgba(203, 213, 225, 0.8);
  transition: color 0.25s var(--ease); position: relative;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
}
nav.links a::after {
  content: ''; position: absolute; bottom: -6px; left: 0; width: 0; height: 1px;
  background: var(--ice); transition: width 0.3s var(--ease);
}
nav.links a:hover { color: var(--ice); }
nav.links a:hover::after { width: 100%; }

.controls { display: flex; align-items: center; gap: 8px; }
.lang-switch {
  display: flex; padding: 3px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(0, 0, 0, 0.45);
}
.lang-switch button {
  padding: 4px 9px; border-radius: 999px;
  font-size: 10px; letter-spacing: 0.15em; color: rgba(203, 213, 225, 0.7);
  transition: all 0.25s var(--ease); font-weight: 500;
}
.lang-switch button.active {
  background: var(--ice); color: #000;
  box-shadow: 0 0 12px rgba(125, 211, 252, 0.4);
}
.menu-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(0, 0, 0, 0.4); color: var(--silver);
  transition: all 0.25s var(--ease);
}
.menu-toggle:hover { border-color: var(--ice); color: var(--ice); }
@media (min-width: 900px) { .menu-toggle { display: none; } }
.menu-toggle .lines { display: flex; flex-direction: column; gap: 3px; }
.menu-toggle .lines span {
  display: block; width: 16px; height: 1.5px; background: currentColor;
  transition: all 0.3s var(--ease); border-radius: 2px;
}
.menu-toggle.open .lines span:nth-child(1) { transform: translateY(4.5px) rotate(45deg); }
.menu-toggle.open .lines span:nth-child(2) { opacity: 0; }
.menu-toggle.open .lines span:nth-child(3) { transform: translateY(-4.5px) rotate(-45deg); }

/* Mobile menu */
#mobile-menu {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0, 0, 0, 0.96); backdrop-filter: blur(20px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; opacity: 0; pointer-events: none;
  transition: opacity 0.35s var(--ease);
}
#mobile-menu.open { opacity: 1; pointer-events: auto; }
#mobile-menu a {
  font-size: 22px; font-weight: 300; letter-spacing: 0.12em;
  color: var(--silver); transform: translateY(20px); opacity: 0;
  transition: all 0.4s var(--ease);
}
#mobile-menu.open a {
  transform: translateY(0); opacity: 1;
}
#mobile-menu.open a:nth-child(1) { transition-delay: 0.05s; }
#mobile-menu.open a:nth-child(2) { transition-delay: 0.1s; }
#mobile-menu.open a:nth-child(3) { transition-delay: 0.15s; }
#mobile-menu.open a:nth-child(4) { transition-delay: 0.2s; }
#mobile-menu a:hover { color: var(--ice); }
#mobile-menu .lang-switch { margin-top: 20px; }
#mobile-menu .lang-switch button { padding: 8px 16px; font-size: 11px; }

/* ---------- Hero ---------- */
#hero {
  position: relative; min-height: 100vh; min-height: 100svh;
  display: flex; align-items: center; overflow: hidden;
  isolation: isolate;
}
#bh-canvas {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
}
#bh-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
.hero-overlay {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(90deg, #000 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0.4) 60%, transparent 100%),
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.9) 100%);
}
@media (max-width: 900px) {
  .hero-overlay {
    background:
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 40%, rgba(0,0,0,0.85) 80%, #000 100%);
  }
}
.hero-content {
  position: relative; z-index: 2;
  max-width: 1280px; width: 100%; margin: 0 auto;
  padding: 96px 24px 60px;
}
.hero-inner { max-width: 640px; }
@media (max-width: 900px) {
  .hero-content { padding: 110px 20px 80px; text-align: left; }
}
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.4em; color: rgba(125, 211, 252, 0.85);
  margin-bottom: 20px; opacity: 0; transform: translateY(20px);
  text-shadow: 0 0 12px rgba(0,0,0,0.95);
  transition: all 0.9s var(--ease) 0.5s;
}
.hero-title {
  font-size: clamp(60px, 12vw, 132px);
  font-weight: 200; letter-spacing: 0.1em;
  line-height: 1; margin-bottom: 24px;
  background: linear-gradient(135deg, #ffffff 0%, #dbeafe 40%, #38bdf8 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: 0; transform: translateY(40px);
  text-shadow: none; filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.15));
  transition: all 1.1s var(--ease) 0.6s;
}
.hero-sub {
  font-size: 15px; line-height: 1.7; color: rgba(203, 213, 225, 0.82);
  max-width: 540px; margin-bottom: 38px;
  opacity: 0; transform: translateY(20px);
  text-shadow: 0 2px 6px rgba(0,0,0,0.95);
  transition: all 0.9s var(--ease) 0.85s;
}
.hero-ctas {
  display: flex; flex-wrap: wrap; gap: 14px;
  opacity: 0; transform: translateY(20px);
  transition: all 0.9s var(--ease) 1.05s;
}
.btn-primary {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 26px; border-radius: 999px;
  background: linear-gradient(135deg, var(--ice), var(--glow));
  color: #000; font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
  transition: box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
  box-shadow: 0 0 0 rgba(56, 189, 248, 0);
}
.btn-primary::before {
  content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  transition: transform 0.6s var(--ease);
}
.btn-primary:hover { box-shadow: 0 0 30px rgba(56, 189, 248, 0.6); transform: translateY(-1px); }
.btn-primary:hover::before { transform: translateX(100%); }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 26px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--silver); font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
  transition: all 0.3s var(--ease);
}
.btn-ghost:hover { border-color: var(--ice); color: var(--ice); transform: translateY(-1px); }

.hero-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; max-width: 480px; margin-top: 52px;
  opacity: 0; transform: translateY(20px);
  transition: all 0.9s var(--ease) 1.25s;
}
.stat {
  padding: 14px 12px; border-radius: 14px;
  background: rgba(5, 10, 20, 0.55);
  border: 1px solid rgba(125, 211, 252, 0.15);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  text-align: center;
}
.stat .val {
  font-size: 24px; font-weight: 300; color: var(--ice);
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
}
.stat .lbl {
  margin-top: 4px; font-size: 9px; letter-spacing: 0.1em;
  color: rgba(203, 213, 225, 0.7); line-height: 1.3;
}

.hero.ready .eyebrow,
.hero.ready .hero-title,
.hero.ready .hero-sub,
.hero.ready .hero-ctas,
.hero.ready .hero-stats { opacity: 1; transform: translateY(0); }

.scroll-hint {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2; opacity: 0; transition: opacity 1.2s var(--ease) 1.8s;
}
.hero.ready .scroll-hint { opacity: 1; }
.scroll-hint .line {
  width: 1px; height: 40px; background: rgba(255,255,255,0.12); overflow: hidden;
}
.scroll-hint .line > div {
  width: 100%; height: 14px; background: var(--ice);
  animation: scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown {
  0% { transform: translateY(-16px); }
  100% { transform: translateY(40px); }
}

/* ---------- Sections ---------- */
.section {
  position: relative; padding: 96px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
@media (min-width: 768px) { .section { padding: 128px 0; } }
.container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 768px) { .container { padding: 0 20px; } }

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.35em; color: rgba(125, 211, 252, 0.75);
  margin-bottom: 16px;
}
.section-title {
  font-size: clamp(32px, 5vw, 48px); font-weight: 300;
  letter-spacing: 0.03em; color: #fff; line-height: 1.15;
  margin-bottom: 16px;
}
.section-sub {
  font-size: 15px; color: rgba(203, 213, 225, 0.75);
  max-width: 620px; line-height: 1.7;
}

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ---------- About ---------- */
.about-grid { display: grid; gap: 32px; margin-top: 48px; }
@media (min-width: 900px) { .about-grid { grid-template-columns: 1fr 1fr; gap: 48px; } }
.about-paras p {
  font-size: 15px; line-height: 1.8; color: rgba(203, 213, 225, 0.78);
  margin-bottom: 16px;
}
.stack-card {
  padding: 26px; border-radius: 18px;
  background: rgba(5, 10, 20, 0.6);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.stack-card h3 {
  font-size: 11px; letter-spacing: 0.3em; color: rgba(125, 211, 252, 0.85);
  font-weight: 500; margin-bottom: 18px;
  font-family: 'JetBrains Mono', monospace;
}
.stack-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.stack-tags span {
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  font-size: 11px; color: rgba(203, 213, 225, 0.85);
  transition: all 0.3s var(--ease);
}
.stack-tags span:hover { border-color: var(--ice); color: var(--ice); transform: translateY(-1px); }

/* ---------- Projects ---------- */
.filters-bar {
  display: flex; flex-direction: column; gap: 16px;
  margin-bottom: 30px;
}
@media (min-width: 768px) {
  .filters-bar { flex-direction: row; align-items: center; justify-content: space-between; }
}
.category-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 16px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(203, 213, 225, 0.7);
  font-size: 10px; letter-spacing: 0.18em; font-weight: 500;
  transition: all 0.28s var(--ease);
}
.chip:hover { border-color: var(--ice); color: var(--ice); }
.chip.active { background: var(--ice); color: #000; border-color: var(--ice); box-shadow: 0 0 16px rgba(125, 211, 252, 0.4); }

.search-wrap { position: relative; }
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 36px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(0, 0, 0, 0.6);
  color: #fff; font-size: 12px;
  outline: none; transition: all 0.28s var(--ease);
}
@media (min-width: 768px) { .search-wrap input { width: 260px; } }
.search-wrap input::placeholder { color: rgba(203, 213, 225, 0.4); }
.search-wrap input:focus { border-color: var(--ice); box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.1); }
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: rgba(203, 213, 225, 0.5);
  pointer-events: none;
}

.projects-grid {
  display: grid; gap: 22px;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .projects-grid { grid-template-columns: repeat(3, 1fr); } }

.project-card {
  position: relative; overflow: hidden;
  border-radius: 18px;
  background: rgba(5, 8, 15, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: all 0.5s var(--ease);
  opacity: 0; transform: translateY(36px);
  display: flex; flex-direction: column;
}
.project-card.visible { opacity: 1; transform: translateY(0); }
.project-card:hover {
  border-color: rgba(125, 211, 252, 0.4);
  box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
  transform: translateY(-3px);
}
.project-cover {
  position: relative; height: 180px; overflow: hidden;
  background: linear-gradient(135deg, #0a1120 0%, #08111e 55%, #000 100%);
  flex-shrink: 0;
}
.project-cover img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.9s var(--ease);
  display: block;
}
.project-card:hover .project-cover img { transform: scale(1.06); }
.project-cover .fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 30% 30%, rgba(56,189,248,0.20), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(255,154,77,0.16), transparent 55%);
}
.project-cover .fallback::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 26px 26px;
  opacity: 0.5;
}
.project-cover .fallback .initials {
  position: relative;
  font-size: 46px; font-weight: 200; letter-spacing: 0.1em;
  color: rgba(255, 255, 255, 0.14);
}
.project-cover .fade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
  background: linear-gradient(to top, rgba(5, 8, 15, 1), transparent);
}
.badge-featured {
  position: absolute; top: 12px; right: 12px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid rgba(255, 154, 77, 0.5);
  color: var(--ember); font-size: 9px; letter-spacing: 0.15em; font-weight: 500;
  backdrop-filter: blur(8px);
}
.project-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
.project-cat {
  display: inline-block; margin-bottom: 10px;
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid rgba(125, 211, 252, 0.25);
  background: rgba(125, 211, 252, 0.06);
  color: rgba(125, 211, 252, 0.9);
  font-size: 9px; letter-spacing: 0.18em; font-weight: 500;
}
.project-title {
  font-size: 17px; font-weight: 500; color: #fff;
  margin-bottom: 8px; line-height: 1.3;
}
.project-desc {
  font-size: 13px; color: rgba(203, 213, 225, 0.72);
  line-height: 1.6; margin-bottom: 14px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}
.project-tech { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.project-tech span {
  padding: 3px 8px; border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 10px; color: rgba(203, 213, 225, 0.7);
}
.project-actions { display: flex; gap: 8px; margin-top: auto; }
.project-actions a {
  flex: 1; text-align: center;
  padding: 8px 12px; border-radius: 999px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
  transition: all 0.28s var(--ease);
}
.project-actions .demo {
  background: rgba(125, 211, 252, 0.12);
  color: var(--ice);
}
.project-actions .demo:hover { background: var(--ice); color: #000; }
.project-actions .gh {
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(203, 213, 225, 0.85);
}
.project-actions .gh:hover { border-color: var(--ice); color: var(--ice); }
.empty-state {
  grid-column: 1 / -1;
  padding: 60px 20px; border-radius: 18
