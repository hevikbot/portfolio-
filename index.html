<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HEVIK — Digital Engineering at the Edge</title>
<meta name="description" content="HEVIK — premium digital product engineering." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root{--bg:#000;--fg:#e2e8f0;--silver:#cbd5e1;--ice:#7dd3fc;--glow:#38bdf8;--ember:#ff9a4d;--border:rgba(125,211,252,.16);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:#000;color:var(--fg);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow-x:hidden;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
::selection{background:rgba(125,211,252,.35);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:linear-gradient(#1e293b,#0ea5e9);border-radius:10px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}

/* PRELOADER */
#preloader{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:preloadAutoHide 2.5s ease-in-out forwards;pointer-events:none}
#preloader.hidden{display:none!important}
@keyframes preloadAutoHide{0%,70%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.pl-ring{position:relative;width:140px;height:140px}
.pl-ring .spin{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,rgba(255,154,77,.95) 30%,rgba(56,189,248,.95) 60%,transparent 100%);animation:spin 2.2s linear infinite}
.pl-ring .inner{position:absolute;inset:12px;border-radius:50%;background:#000;box-shadow:inset 0 0 30px rgba(56,189,248,.15)}
.pl-ring .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.35em;color:rgba(226,232,240,.85);font-family:'JetBrains Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-bar-wrap{margin-top:34px;width:220px}
.pl-bar{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pl-bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--ember),var(--ice),var(--glow))}
.pl-text{margin-top:12px;text-align:center;font-size:10px;letter-spacing:.3em;color:rgba(203,213,225,.6);font-family:'JetBrains Mono',monospace}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:100;animation:headerIn .9s var(--ease) .2s both}
@keyframes headerIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.nav-inner{max-width:1280px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:12px 16px}
@media(min-width:1344px){.nav-inner{margin:12px auto}}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot-wrap{position:relative;width:12px;height:12px;display:inline-flex}
.brand .dot-ping{position:absolute;inset:0;border-radius:50%;background:rgba(255,154,77,.55);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.brand .dot-core{position:relative;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd3a8,#ff7a2e 40%,#7a1f00 100%);box-shadow:0 0 12px rgba(255,154,77,.7)}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
.brand .name{font-size:13px;font-weight:600;letter-spacing:.32em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9)}
nav.links{display:none;gap:32px}
@media(min-width:900px){nav.links{display:flex}}
nav.links a{font-size:11px;letter-spacing:.22em;color:rgba(203,213,225,.8);position:relative;text-shadow:0 1px 2px rgba(0,0,0,.9);transition:color .25s var(--ease)}
nav.links a::after{content:'';position:absolute;bottom:-6px;left:0;width:0;height:1px;background:var(--ice);transition:width .3s var(--ease)}
nav.links a:hover{color:var(--ice)}
nav.links a:hover::after{width:100%}
.controls{display:flex;align-items:center;gap:8px}
.lang-switch{display:flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.45)}
.lang-switch button{padding:4px 9px;border-radius:999px;font-size:10px;letter-spacing:.15em;color:rgba(203,213,225,.7);font-weight:500;transition:all .25s var(--ease)}
.lang-switch button.active{background:var(--ice);color:#000;box-shadow:0 0 12px rgba(125,211,252,.4)}
.menu-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);color:var(--silver);transition:all .25s var(--ease)}
.menu-toggle:hover{border-color:var(--ice);color:var(--ice)}
@media(min-width:900px){.menu-toggle{display:none}}
.menu-toggle .lines{display:flex;flex-direction:column;gap:3px}
.menu-toggle .lines span{display:block;width:16px;height:1.5px;background:currentColor;transition:all .3s var(--ease);border-radius:2px}
.menu-toggle.open .lines span:nth-child(1){transform:translateY(4.5px) rotate(45deg)}
.menu-toggle.open .lines span:nth-child(2){opacity:0}
.menu-toggle.open .lines span:nth-child(3){transform:translateY(-4.5px) rotate(-45deg)}

/* MOBILE MENU */
#mobile-menu{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
#mobile-menu.open{opacity:1;pointer-events:auto}
#mobile-menu a{font-size:22px;font-weight:300;letter-spacing:.12em;color:var(--silver);transform:translateY(20px);opacity:0;transition:all .4s var(--ease)}
#mobile-menu.open a{transform:translateY(0);opacity:1}
#mobile-menu.open a:nth-child(1){transition-delay:.05s}
#mobile-menu.open a:nth-child(2){transition-delay:.1s}
#mobile-menu.open a:nth-child(3){transition-delay:.15s}
#mobile-menu.open a:nth-child(4){transition-delay:.2s}
#mobile-menu a:hover{color:var(--ice)}
#mobile-menu .lang-switch{margin-top:20px}
#mobile-menu .lang-switch button{padding:8px 16px;font-size:11px}

/* HERO */
#hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;isolation:isolate}
#bh-canvas{position:absolute;inset:0;z-index:0;pointer-events:none}
#bh-canvas canvas{display:block;width:100%!important;height:100%!important}
.hero-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.85) 35%,rgba(0,0,0,.4) 60%,transparent 100%),linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 35%,transparent 65%,rgba(0,0,0,.9) 100%)}
@media(max-width:900px){.hero-overlay{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 40%,rgba(0,0,0,.85) 80%,#000 100%)}}
.hero-content{position:relative;z-index:2;max-width:1280px;width:100%;margin:0 auto;padding:96px 24px 60px}
.hero-inner{max-width:640px}
@media(max-width:900px){.hero-content{padding:110px 20px 80px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpBig{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4em;color:rgba(125,211,252,.85);margin-bottom:20px;text-shadow:0 0 12px rgba(0,0,0,.95);animation:fadeUp .9s var(--ease) .5s both}
.hero-title{font-size:clamp(60px,12vw,132px);font-weight:200;letter-spacing:.1em;line-height:1;margin-bottom:24px;background:linear-gradient(135deg,#ffffff 0%,#dbeafe 40%,#38bdf8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(56,189,248,.15));animation:fadeUpBig 1.1s var(--ease) .6s both}
.hero-sub{font-size:15px;line-height:1.7;color:rgba(203,213,225,.82);max-width:540px;margin-bottom:38px;text-shadow:0 2px 6px rgba(0,0,0,.95);animation:fadeUp .9s var(--ease) .85s both}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;animation:fadeUp .9s var(--ease) 1.05s both}
.btn-primary{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;background:linear-gradient(135deg,var(--ice),var(--glow));color:#000;font-size:11px;font-weight:600;letter-spacing:.22em;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.btn-primary::before{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transition:transform .6s var(--ease)}
.btn-primary:hover{box-shadow:0 0 30px rgba(56,189,248,.6);transform:translateY(-1px)}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:var(--silver);font-size:11px;font-weight:600;letter-spacing:.22em;transition:all .3s var(--ease)}
.btn-ghost:hover{border-color:var(--ice);color:var(--ice);transform:translateY(-1px)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:480px;margin-top:52px;animation:fadeUp .9s var(--ease) 1.25s both}
.stat{padding:14px 12px;border-radius:14px;background:rgba(5,10,20,.55);border:1px solid rgba(125,211,252,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center}
.stat .val{font-size:24px;font-weight:300;color:var(--ice);text-shadow:0 0 12px rgba(56,189,248,.4)}
.stat .lbl{margin-top:4px;font-size:9px;letter-spacing:.1em;color:rgba(203,213,225,.7);line-height:1.3}
.scroll-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:2;animation:fadeIn 1.2s var(--ease) 1.8s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scroll-hint .line{width:1px;height:40px;background:rgba(255,255,255,.12);overflow:hidden}
.scroll-hint .line>div{width:100%;height:14px;background:var(--ice);animation:scrollDown 2s ease-in-out infinite}
@keyframes scrollDown{0%{transform:translateY(-16px)}100%{transform:translateY(40px)}}

/* SECTIONS */
.section{position:relative;padding:96px 0;border-top:1px solid rgba(255,255,255,.05)}
@media(min-width:768px){.section{padding:128px 0}}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
@media(max-width:768px){.container{padding:0 20px}}
.section-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.35em;color:rgba(125,211,252,.75);margin-bottom:16px}
.section-title{font-size:clamp(32px,5vw,48px);font-weight:300;letter-spacing:.03em;color:#fff;line-height:1.15;margin-bottom:16px}
.section-sub{font-size:15px;color:rgba(203,213,225,.75);max-width:620px;line-height:1.7}

/* ABOUT */
.about-grid{display:grid;gap:32px;margin-top:48px}
@media(min-width:900px){.about-grid{grid-template-columns:1fr 1fr;gap:48px}}
.about-paras p{font-size:15px;line-height:1.8;color:rgba(203,213,225,.78);margin-bottom:16px}
.stack-card{padding:26px;border-radius:18px;background:rgba(5,10,20,.6);border:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stack-card h3{font-size:11px;letter-spacing:.3em;color:rgba(125,211,252,.85);font-weight:500;margin-bottom:18px;font-family:'JetBrains Mono',monospace}
.stack-tags{display:flex;flex-wrap:wrap;gap:8px}
.stack-tags span{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:11px;color:rgba(203,213,225,.85);transition:all .3s var(--ease)}
.stack-tags span:hover{border-color:var(--ice);color:var(--ice);transform:translateY(-1px)}

/* PROJECTS */
.filters-bar{display:flex;flex-direction:column;gap:16px;margin-bottom:30px}
@media(min-width:768px){.filters-bar{flex-direction:row;align-items:center;justify-content:space-between}}
.category-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.15);color:rgba(203,213,225,.7);font-size:10px;letter-spacing:.18em;font-weight:500;transition:all .28s var(--ease)}
.chip:hover{border-color:var(--ice);color:var(--ice)}
.chip.active{background:var(--ice);color:#000;border-color:var(--ice);box-shadow:0 0 16px rgba(125,211,252,.4)}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.6);color:#fff;font-size:12px;outline:none;transition:all .28s var(--ease)}
@media(min-width:768px){.search-wrap input{width:260px}}
.search-wrap input::placeholder{color:rgba(203,213,225,.4)}
.search-wrap input:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(125,211,252,.1)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:rgba(203,213,225,.5);pointer-events:none}
.projects-grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:640px){.projects-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.projects-grid{grid-template-columns:repeat(3,1fr)}}
.project-card{position:relative;overflow:hidden;border-radius:18px;background:rgba(5,8,15,.82);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .5s var(--ease);display:flex;flex-direction:column;animation:cardIn .7s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
.project-card:hover{border-color:rgba(125,211,252,.4);box-shadow:0 0 40px rgba(56,189,248,.15);transform:translateY(-3px)}
.project-cover{position:relative;height:180px;overflow:hidden;background:linear-gradient(135deg,#0a1120 0%,#08111e 55%,#000 100%);flex-shrink:0}
.project-cover img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease);display:block}
.project-card:hover .project-cover img{transform:scale(1.06)}
.project-cover .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,rgba(56,189,248,.20),transparent 60%),radial-gradient(circle at 70% 70%,rgba(255,154,77,.16),transparent 55%)}
.project-cover .fallback::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:26px 26px;opacity:.5}
.project-cover .fallback .initials{position:relative;font-size:46px;font-weight:200;letter-spacing:.1em;color:rgba(255,255,255,.14)}
.project-cover .fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to top,rgba(5,8,15,1),transparent)}
.badge-featured{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid rgba(255,154,77,.5);color:var(--ember);font-size:9px;letter-spacing:.15em;font-weight:500;backdrop-filter:blur(8px)}
.project-body{padding:20px;display:flex;flex-direction:column;flex:1}
.project-cat{display:inline-block;margin-bottom:10px;padding:3px 10px;border-radius:999px;border:1px solid rgba(125,211,252,.25);background:rgba(125,211,252,.06);color:rgba(125,211,252,.9);font-size:9px;letter-spacing:.18em;font-weight:500}
.project-title{font-size:17px;font-weight:500;color:#fff;margin-bottom:8px;line-height:1.3}
.project-desc{font-size:13px;color:rgba(203,213,225,.72);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.project-tech{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.project-tech span{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);font-size:10px;color:rgba(203,213,225,.7)}
.project-actions{display:flex;gap:8px;margin-top:auto}
.project-actions a{flex:1;text-align:center;padding:8px 12px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.18em;transition:all .28s var(--ease)}
.project-actions .demo{background:rgba(125,211,252,.12);color:var(--ice)}
.project-actions .demo:hover{background:var(--ice);color:#000}
.project-actions .gh{border:1px solid rgba(255,255,255,.15);color:rgba(203,213,225,.85)}
.project-actions .gh:hover{border-color:var(--ice);color:var(--ice)}
.empty-state{grid-column:1/-1;padding:60px 20px;border-radius:18px;border:1px dashed rgba(255,255,255,.1);text-align:center;color:rgba(203,213,225,.55);font-size:13px}

/* CONTACT */
.contact-wrap{max-width:780px;margin:0 auto}
.contact-form{padding:26px;border-radius:20px;background:rgba(3,6,14,.85);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@media(min-width:640px){.contact-form{padding:34px}}
.form-row{display:grid;gap:14px}
@media(min-width:640px){.form-row{grid-template-columns:1fr 1fr}}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px;font-size:10px;letter-spacing:.18em;color:rgba(203,213,225,.6);font-weight:500;font-family:'JetBrains Mono',monospace}
.field input,.field textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);color:#fff;font-size:13px;outline:none;transition:all .28s var(--ease);resize:vertical}
.field textarea{min-height:120px;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(125,211,252,.1)}
.form-status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:12px;display:none}
.form-status.success{display:block;border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.form-status.error{display:block;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#fca5a5}
.btn-submit{width:100%;margin-top:8px;padding:14px;border-radius:999px;background:linear-gradient(135deg,var(--ice),var(--glow));color:#000;font-size:11px;font-weight:600;letter-spacing:.22em;transition:all .3s var(--ease)}
.btn-submit:hover{box-shadow:0 0 30px rgba(56,189,248,.5)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* FOOTER */
footer{position:relative;padding:36px 0 28px;border-top:1px solid rgba(255,255,255,.05)}
.footer-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
@media(min-width:640px){.footer-inner{flex-direction:row;justify-content:space-between}}
footer .copy{font-size:11px;color:rgba(203,213,225,.5)}
footer .made{font-size:10px;letter-spacing:.18em;color:rgba(203,213,225,.4)}
footer .admin-link{font-size:10px;letter-spacing:.18em;color:rgba(125,211,252,.5);transition:color .25s var(--ease);font-family:'JetBrains Mono',monospace}
footer .admin-link:hover{color:var(--ice)}

/* ADMIN */
#admin-view{position:fixed;inset:0;z-index:200;background:#000;overflow-y:auto;display:none}
#admin-view.open{display:block}
.admin-inner{max-width:1100px;margin:0 auto;padding:30px 24px 60px}
.admin-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.admin-title{font-size:22px;font-weight:300;letter-spacing:.12em;color:#fff}
.admin-close{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.15);font-size:10px;letter-spacing:.18em;color:rgba(203,213,225,.75);transition:all .25s var(--ease)}
.admin-close:hover{border-color:var(--ice);color:var(--ice)}
.admin-login{max-width:380px;margin:60px auto;padding:30px;background:rgba(3,6,14,.85);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(18px)}
.admin-login h2{font-size:15
